<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>phone audit</title>
  <style>
    html,body{margin:0;background:#111;color:#eee;font:12px/1.4 -apple-system,monospace}
    .row{display:flex;gap:8px;align-items:flex-start;padding:8px}
    figure{margin:0}
    figcaption{font:11px monospace;color:#8f8;padding:2px 0}
    iframe{border:1px solid #444;display:block;width:390px;height:840px;background:#000}
    #out{white-space:pre-wrap;word-break:break-all;color:#0f0;background:#000;font:11px/1.3 monospace;padding:6px;margin:0}
  </style>
  </head>
  <body>
    <pre id="out">loading…</pre>
    <div class="row" id="row"></div>
    <script>
      const routes = (new URLSearchParams(location.search).get('routes') || '/').split(',')
      const row = document.getElementById('row')
      routes.forEach((r) => {
        const fig = document.createElement('figure')
        const cap = document.createElement('figcaption')
        cap.textContent = r
        const f = document.createElement('iframe')
        f.src = r
        f.dataset.route = r
        fig.append(cap, f)
        row.append(fig)
      })
      setTimeout(() => {
        const rows = []
        document.querySelectorAll('iframe').forEach((f) => {
          const d = f.contentDocument
          const vw = d.documentElement.clientWidth
          const sw = d.documentElement.scrollWidth
          rows.push('=== ' + f.dataset.route + '  clientWidth=' + vw + ' scrollWidth=' + sw)
          if (sw > vw) {
            d.querySelectorAll('*').forEach((el) => {
              const rc = el.getBoundingClientRect()
              if (rc.right > vw + 1 || rc.left < -1) {
                rows.push('   ' + el.tagName + '.' + String(el.className).slice(0, 70) + ' L=' + Math.round(rc.left) + ' R=' + Math.round(rc.right) + ' W=' + Math.round(rc.width))
              }
            })
          }
        })
        document.getElementById('out').textContent = rows.join('\n')
      }, 4000)
    </script>
  </body>
</html>
