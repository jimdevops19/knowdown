<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The buzzer mark on its own tile. The SVG is what a modern browser
         picks; the two PNGs are for the surfaces that still ask for a raster
         one (some bookmark lists, older Android). All of them, and every icon
         below, are regenerated by scripts/generate_pwa_icons.py. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- viewport-fit=cover lets the app paint under the notch and the home
         indicator; the safe-area utilities in index.css keep content out of
         them. `maximum-scale` is deliberately NOT set — pinch-zoom stays
         available, and a quiz with a ten-second clock is exactly the kind of
         app somebody may need to zoom into. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>knowdown</title>
    <meta
      name="description"
      content="Real-time 1v1 trivia. Get paired with a stranger and race them through NBA questions."
    />

    <!-- ── PWA ────────────────────────────────────────────────────────────
         The manifest is generated at build time by vite-plugin-pwa (see
         vite.config.ts) and injected here. These tags are the parts a manifest
         cannot carry: theme-color tints the Android status bar and the desktop
         title bar, and the apple-* tags are Safari's older, manifest-ignoring
         equivalents — without them an iOS home-screen launch opens in a
         browser tab rather than standalone. -->
    <meta name="theme-color" content="#04202e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the page draws behind the status bar (paired with
         viewport-fit=cover above), so the dark app background runs edge to edge. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="knowdown" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="knowdown" />
    <meta property="og:title" content="knowdown — real-time 1v1 trivia" />
    <meta
      property="og:description"
      content="Two players. Seven questions. One clock."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
