<!-- The knowdown mark: a wide, flat-sided K cut out of the brand orange tile.
     Hand-kept in step with LogoMark in frontend/src/components/Logo.tsx and
     with scripts/generate_pwa_icons.py — same 32-unit grid, same coordinates.
     Colours are literals, not tokens: a favicon is fetched before any
     stylesheet and cannot read a CSS variable. #ff6b00 is --color-court and
     #0b0b0b is --color-void. -->
