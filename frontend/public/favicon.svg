  <rect width="32" height="32" rx="5" fill="#ff6b00"/>
  <path d="M8 7h4.4v18H8z" fill="#0b0b0b"/>
  <path d="M24.4 7L16 15.2l8.8 9.8h-5.6l-7-8.1v-1.7L19 7z" fill="#0b0b0b"/>
</svg>
