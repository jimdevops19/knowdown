# NBA — gradual-hints questions: the clues arrive while the clock runs.
#
# THIS TYPE
#   hints:                  up to FOUR clues, authored HARDEST FIRST. The list
#                           order is the reveal order; positions are not
#                           authored, so a file cannot leave a gap in one.
#
#                           WARNING — DO NOT AUTHOR A FIFTH HINT. The board
#                           holds four clues at phone resolution; a fifth one
#                           overflows the hint panel and is not displayed in a
#                           user-friendly way (it pushes the answer boxes off
#                           screen, so a player on a phone is typing blind).
#                           The loader still accepts five for legacy rows —
#                           this cap is an authoring rule, not a load error.
#                           Every question in this file stops at four.
#   hint_interval_seconds:  the gap between one clue and the next. Defaults to
#                           5, may be 1..15.
#   answer_fields:          the boxes the player fills in — a label, every
#                           spelling that fills it, and `kind: number` on the
#                           ones that want digits (the default is `text`).
#
#                           WARNING — DO NOT AUTHOR A THIRD FIELD. Two boxes
#                           is the cap. At phone resolution a third one makes
#                           the answer area look crowded and is not displayed
#                           in a user-friendly way: the player has to scroll
#                           down and tap back into a box to keep typing, which
#                           costs them seconds on a clock that never stops.
#                           The loader still accepts more for legacy rows —
#                           this cap is an authoring rule, not a load error.
#                           Every question in this file stops at two.
#
# The first clue lands the moment the clock starts and each of the others one
# interval later, on the server's own stamp, so both players watch the same
# reveal at the same instant. A player who answers on clue one is answering a
# harder question than one who waits for clue four, and the match engine pays
# them for it: points are credit times speed, and the clock does not stop while
# you wait to be told more.
#
# WRITE THE CLUES AS A DESCENT. Clue one should be gettable only by someone who
# was there — a final score, a stat line, a possession nobody else remembers.
# Clue four should be nearly the giveaway. A file whose first clue already
# names the series has made the other three decorative, and a file whose last
# clue is still cryptic is a ten-second question wearing a forty-second clock.
#
# SCORING IS PER FIELD. A player who gets the year but not the game number
# scored half, exactly the way a matrix grid is credited per cell (see
# matrix.yaml). So fields should be independently knowable: "year"
# and "round" are two facts, "year" and "the last two digits of the year" are
# one fact asked twice.
#
# SAY WHICH BOXES ARE NUMBERS. `kind: number` draws a short box and opens a
# number pad on a phone; `text` (the default) draws a wide one. It is a promise
# about what to type, so the loader refuses a `number` field keyed to anything
# that is not digits — a box wanting "Game 7" is a text box, even though it is
# mostly a number. Nothing about the *answer* reaches the board: the width comes
# from the kind, never from how long the accepted answers happen to be.
#
# NO CLUE MAY CONTAIN AN ANSWER. A hint that says "in 2016" beside a Year box,
# or "he finished with 70 points" beside a Points box, is not a clue — it is the
# answer key on a timer, and it makes the two fields one fact. Name the thing
# around the answer (the opponent, the arena, the record it broke) and let the
# player supply the number. The same goes for arithmetic giveaways: "the series
# ended 4-3" beside a Game number box spells out seven.
#
# ACCEPTED ANSWERS ARE SHORT. Matching is case- and whitespace-insensitive but
# nothing else, so list every honest spelling — a player racing a clock types
# `7`, not `Game 7`. Listing the same spelling twice in different cases is a
# load error, as it is for free-text.
#
# THE CLOCK MUST OUTLAST THE SCHEDULE. A question here gets the 30 seconds this
# file sets below unless it authors its own `time_limit_seconds`, and the loader
# refuses any question whose last clue would land with under 10 seconds left to
# type — four clues at five seconds puts the last at 15s, comfortably inside it.
# Slow the reveal down and you must raise the clock to match.
#
# See single-answer.yaml for the fields every question carries.
#
# Loaded by: uv run python manage.py sync_questions

category: nba

# How long every question in this file stays open, unless an entry names its own
# time_limit_seconds. The question is still being asked while you answer it: the
# clock has to outlast the hint schedule and still leave time to type
# (HINT_ANSWER_WINDOW_SECONDS, checked at load).
time_limit_seconds: 30

