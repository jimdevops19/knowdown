# NBA — multiple-answer questions: several options are right, find them all.
#
# THIS TYPE
#   options: three or more, with AT LEAST TWO marked correct and at least one
#   not. Both bounds are enforced at load time and both are about the question
#   being worth asking: one correct option is a single-answer wearing the wrong
#   type, and marking every option correct turns "select all that apply" into
#   "select everything".
#
# Aim for a mix a knowledgeable fan can separate — a list where the wrong
# options are obviously wrong is answered by elimination and tests nothing.
#
# See single-answer.yaml for the fields every question carries.
#
# Loaded by: uv run python manage.py sync_questions

