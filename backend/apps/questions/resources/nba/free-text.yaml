# NBA — free-text questions: the player types the answer.
#
# THIS TYPE
#   accepted_answers: every spelling that counts as right. Matching is
#   case-insensitive, so listing a name twice in different cases is a load error.
#
# List the SHORT forms. A player racing a ten-second clock types "Kobe", not
# "Kobe Bryant" — and an answer that is right but too slow to type is a question
# testing typing speed. Include surnames, nicknames a broadcaster would use, and
# the way the answer is spelled on a jersey.
#
# Do not use this type where the answer has an open-ended number of phrasings
# ("what happened in game 6?"). If you cannot enumerate the right answers, it is
# a single-answer question.
#
# See single-answer.yaml for the fields every question carries.
#
# Loaded by: uv run python manage.py sync_questions

category: nba

# How long every question in this file stays open, unless an entry names its own
# time_limit_seconds. A typed answer is slower than a tapped one: the clock has
# to cover reading the question, recalling the name and spelling it. Twenty
# seconds.
time_limit_seconds: 20

