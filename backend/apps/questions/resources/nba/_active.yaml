# The question files this category loads. Comment a line out to park its
# questions: they stop being served (and are deactivated on the next sync),
# and come back by uncommenting it. Order is the load order.
resources:
  - free-text.yaml
  - gradual-hints.yaml
  - image-answer.yaml
  - matrix.yaml
  - multiple-answer.yaml
  - ordering.yaml
  - single-answer.yaml
  - true-false.yaml
