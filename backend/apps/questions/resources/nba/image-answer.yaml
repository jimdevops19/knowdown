# NBA — image-answer questions: the options are pictures.
#
# THIS TYPE
#   options: two or more, exactly one with `is_correct: true`, each naming an
#            `image` — a FILENAME in nba/images/, not a path. The same picture
#            twice is a load error: two identical buttons, one of them wrong.
#   label:   optional alt text, and what a result screen can call the option.
#            Leave it out where naming the option would give the answer away.
#
# A separate type from `single-answer` rather than a flag on it, because the
# client draws a grid of images instead of a list of rows — a question that could
# be either has no single layout.
#
# Note this is NOT the same as a question's own `image:` field, which illustrates
# what is being ASKED about (see single-answer.yaml). Here the pictures are the
# answer.
#
# The diagrams below are generated by scripts/generate_court_diagrams.py — see
# images/README.md, which also covers what a photographic asset would need.
#
# Loaded by: uv run python manage.py sync_questions

category: nba

questions:
  - type: image-answer
    slug: nba-identify-free-throw-line
    description: >-
      Each diagram shows the same half court with one line picked out in red.
      Which one marks the free-throw line?
    level: 1
    tags: {topic: rules, era: all-time}
    options:
      - {image: court-free-throw-line.png, is_correct: true}
      - {image: court-three-point-line.png}
      - {image: court-baseline-line.png}
      - {image: court-halfcourt-line.png}

  - type: image-answer
    slug: nba-identify-three-point-line
    description: >-
      Same four diagrams. Which one marks the three-point line?
    level: 1
    tags: {topic: rules, era: all-time}
    options:
      - {image: court-three-point-line.png, is_correct: true}
      - {image: court-free-throw-line.png}
      - {image: court-baseline-line.png}
      - {image: court-halfcourt-line.png}
