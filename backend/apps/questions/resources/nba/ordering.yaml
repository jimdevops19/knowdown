# NBA — ordering questions: put these in the right sequence.
#
# THIS TYPE
#   instruction: the rule for answering, kept separate from `description`
#                because the client shows them in different places. "Highest to
#                lowest" buried in the question is a direction players miss.
#   items:       three or four, written IN THEIR CORRECT ORDER. Positions are
#                not authored — the list order is the answer, so a file cannot
#                have a gap or a duplicate position. The client shuffles what it
#                draws; the correct order never leaves the server in question form.
#
#                WARNING — DO NOT AUTHOR A FIFTH ITEM. The board holds four
#                tiles at phone resolution; a fifth one overflows the ordering
#                list and is not displayed in a user-friendly way (the bottom
#                tile sits off screen, so a player on a phone drags against
#                something they cannot see). The loader still accepts more for
#                legacy rows — this cap is an authoring rule, not a load error.
#                Every question in this file stops at four.
#
# Pick facts with an unambiguous order that will not drift: career totals of
# retired players and dated events are safe, "best" anything is not, and an
# active player's totals make a question that quietly goes wrong mid-season.
#
# Items must not be the years/numbers themselves in a row (1991, 1992, 1993,
# ...) — sorting bare numbers takes no basketball knowledge at all, so that
# tests reading comprehension, not trivia. Name the thing that happened in
# each year (the opponent beaten, the award won, the record set) and let the
# YEAR be the fact a player has to know, not the fact printed in front of them.
#
# See single-answer.yaml for the fields every question carries.
#
# Loaded by: uv run python manage.py sync_questions

category: nba

# How long every question in this file stays open, unless an entry names its own
# time_limit_seconds. Ordering is a board to rearrange, not an option to pick,
# and every drag is a re-read of the ones either side of it.
time_limit_seconds: 30

# Shown alone, full screen, for a beat before any question in this file appears
# — the whole file's questions are answered the same way, so the task is stated
# once here rather than on each entry. Ordering is the type whose tiles look
# like options and are not: a player who reads them as "pick the right one" has
# lost the question before the clock starts. An entry may override it, or write
# an empty one to open with no screen at all.
pre_question_info: Click to order from earliest to latest

