# The rooms the platform offers — the lobby, authored.
#
# A room is *the settings a match is played under*, named: which categories the
# board is drawn from, which tags narrow each of them, and how many questions a
# match here runs. Picking a room is what a player does instead of picking a
# category, which is why a room that names one category and no tags is exactly
# the old behaviour with a name on it.
#
# `slug` is the identifier everything else uses: the URL a player joins on and
# the matchmaking pool's key. It is permanent — renaming one orphans every link
# into that room.
#
# `questions_asked_ranges` is the set of match lengths this room runs; one is
# drawn at random per matchup. A list of the counts themselves, not a low/high
# pair: [4, 5, 6] means those three numbers.
#
# `categories` is drawn from in the order written, and the FIRST one is the
# room's rating scope — a rating is per category (apps.rankings), and a room
# that mixes sports still has to move exactly one ladder. `filter_tags` narrows
# a category to the questions carrying those facets; leave it out and the whole
# category is in play.
#
# `is_active: false` takes a room out of the lobby without deleting it, for one
# that is seasonal or still being authored. Removing a room from this file does
# the same thing (it is deactivated, never deleted), because matchups already
# played in it point at the row.
#
# `logo` is an optional badge the lobby's ball wears on its face. Leave it out
# (the common case) and the ball is plain. Either way the room's `name` is set
# in big display caps *under* the ball, so a logo never costs the room its
# name.
#
# The value is a key, not a picture — the actual artwork lives in
# `frontend/src/components/icons/roomLogos.tsx`, in the `ROOM_LOGOS` registry.
# To see what logos exist today, or to add a new one:
#   1. Open frontend/src/components/icons/roomLogos.tsx and look at ROOM_LOGOS.
#   2. To add one: draw the icon there, add its key to ROOM_LOGOS, then add the
#      same key to apps.rooms.constants.ROOM_LOGO_KEYS (the backend allow-list
#      this file is validated against — an unknown key fails the sync rather
#      than rendering a blank ball).
# Known keys as of this writing (5): tv (a boxy retro CRT), leagueball (a
# basketball drawn in reverse, navy body and chalk seams — the one way a ball
# reads on an orange ball), banner (a championship pennant with a notched
# hem), medal (a ribboned disc), hungupjersey (a jersey on a peg — "hang 'em
# up", retirement itself rather than the player retiring).
#
# `color` is which hue the room's ball is drawn in. Leave it out (the common
# case) and the lobby cycles the default four (orange, violet, pink, lime) by
# the room's position instead — a room only needs `color:` to break from that
# rotation on purpose.
#
# Like `logo`, the value is a key, not a hex code — the gradients live in
# `frontend/src/components/avatars/RoomBall.tsx`, in the `PALETTES` object.
# To see what colors exist, or to add a new one:
#   1. Open frontend/src/components/avatars/RoomBall.tsx and look at PALETTES.
#   2. To add one: pick light/mid/dark/rim shades there, add the key to
#      PALETTES, then add the same key to
#      apps.rooms.constants.ROOM_BALL_COLOR_KEYS (the backend allow-list this
#      file is validated against).
# Known keys as of this writing (28): orange, violet, pink, lime, red, amber,
# gold, yellow, green, emerald, teal, cyan, sky, blue, indigo, purple,
# fuchsia, rose, copper, slate, peach, apricot, tangerine, marmalade, rust,
# sunset, honey, papaya.
#
# Loaded by: uv run python manage.py sync_rooms   (after sync_questions)

- name: All NBA
  slug: nba-room-general
  description: >-
    The whole catalog, no filters — every era, every corner of the league.
  questions_asked_ranges: [3, 5, 7]
  display_order: 1
  color: orange
  logo: leagueball
  categories:
    - slug: nba

- name: June Basketball
  slug: nba-room-finals
  description: >-
    June basketball only: Best finals moments and series, the shots and the runs that decided a
    title and changed the history of basketball
  questions_asked_ranges: [4, 5, 6]
  color: gold
  display_order: 2
  logo: banner
  categories:
    - slug: nba
      filter_tags:
        topic: finals

- name: The 2000s
  slug: nba-room-2000s
  color: copper
  description: >-
    Kobe, Duncan, the Pistons and everything else from the decade the league
    argues hardest about.
  questions_asked_ranges: [4, 5, 6]
  display_order: 3
  logo: tv
  categories:
    - slug: nba
      filter_tags:
        era: "2000s"

- name: Awards
  slug: nba-room-awards
  description: >-
    MVPs, Rookies of the Year, Defensive Players — who took home what, and
    when.
  questions_asked_ranges: [3, 5]
  display_order: 4
  color: slate
  logo: medal
  categories:
    - slug: nba
      filter_tags:
        topic: awards

- name: Russell Westbrook
  slug: nba-room-westbrook
  description: >-
    Celebrating Russell Westbrook's career — let's see if you can beat your
    opponent on your knowledge of Russell Westbrook.
  questions_asked_ranges: [4, 5, 6]
  display_order: 5
  logo: hungupjersey
  categories:
    - slug: nba
      filter_tags:
        player: westbrook
