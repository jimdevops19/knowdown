[project]
name = "knowdown"
version = "0.1.0"
description = "Knowdown — real-time 1v1 trivia. Backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Realtime. No consumers yet — the match loop lands with apps/matches —
    # but the channel layer is configured from the start so the settings that
    # decide it (REDIS_URL, the in-memory fallback) are exercised in dev.
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "dj-database-url>=3.1.2",
    "dj-rest-auth>=7.2.0",
    "django>=6.0.7",
    "django-allauth[socialaccount]>=65.18.0",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    # Validates the authored YAML in apps/questions/resources before any of it
    # reaches the database. See apps/questions/schemas.
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "nba-api>=1.10",
    "pip-audit>=2.9.0",
    # apps.matches.management.commands.load_rehearsal — a black-box client
    # against a deployed instance's real HTTP + WebSocket surface. Dev-only:
    # the rehearsal is run from an operator's machine or CI, never shipped in
    # the runtime image (backend/Dockerfile's `uv sync --no-dev`).
    "httpx>=0.28",
    "websockets>=15.0",
]
